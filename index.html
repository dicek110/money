<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREシミュレーション</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.8rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group:last-of-type { margin-bottom: 0; }
        .label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .value-display {
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        
        /* 🚀 追加：実行ボタンのスタイリング */
        .btn-container {
            margin: 15px 0 25px 0;
        }
        .calc-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        .calc-btn:hover {
            background-color: #1d4ed8;
        }
        .calc-btn:active {
            transform: scale(0.99);
        }

        .result-title {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 8px;
        }
        .result-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .breakdown {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .breakdown-item:last-child { margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 FIREシミュレーション</h1>
    
    <!-- 入力カード -->
    <div class="card">
        <div class="control-group">
            <div class="label-wrapper">
                <label for="initAsset">現在の資産</label>
                <span class="value-display"><span id="initAssetVal">500</span>万円</span>
            </div>
            <input type="range" id="initAsset" min="0" max="10000" step="100" value="500">
        </div>

        <div class="control-group">
            <div class="label-wrapper">
                <label for="monthlyInput">毎月の積立額</label>
                <span class="value-display"><span id="monthlyInputVal">10</span>万円</span>
            </div>
            <input type="range" id="monthlyInput" min="0" max="100" step="1" value="10">
        </div>

        <div class="control-group">
            <div class="label-wrapper">
                <label for="years">積立・運用期間</label>
                <span class="value-display"><span id="yearsVal">7</span>年</span>
            </div>
            <input type="range" id="years" min="1" max="40" step="1" value="7">
        </div>

        <div class="control-group">
            <div class="label-wrapper">
                <label for="yield">想定年利 (運用リターン)</label>
                <span class="value-display"><span id="yieldVal">1.0</span>%</span>
            </div>
            <input type="range" id="yield" min="0" max="15" step="0.5" value="1.0">
        </div>
    </div>

    <!-- 🚀 追加：実行ボタン -->
    <div class="btn-container">
        <button id="calcBtn" class="calc-btn">シミュレーションを実行する</button>
    </div>

    <!-- 結果カード -->
    <div class="card">
        <div class="result-title">期間終了時の想定総資産</div>
        <div class="result-value" id="totalAsset">--- 円</div>
        
        <div class="breakdown">
            <div class="breakdown-item">
                <span>投資元本総額:</span>
                <span id="totalPrincipal">--- 円</span>
            </div>
            <div class="breakdown-item">
                <span>運用利益（複利効果）:</span>
                <span id="totalInterest" style="color: #10b981; font-weight: bold;">--- 円</span>
            </div>
            <div class="breakdown-item" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border-color); flex-direction: column; gap: 4px;">
                <span>4%ルールでの年間取崩し目安:</span>
                <span id="fourPercentRule" style="font-weight: bold; color: var(--text-color);">---</span>
            </div>
        </div>
    </div>
</div>

<script>
    // DOM要素の取得
    const inputs = {
        initAsset: document.getElementById('initAsset'),
        monthlyInput: document.getElementById('monthlyInput'),
        years: document.getElementById('years'),
        yield: document.getElementById('yield')
    };

    const displays = {
        initAssetVal: document.getElementById('initAssetVal'),
        monthlyInputVal: document.getElementById('monthlyInputVal'),
        yearsVal: document.getElementById('yearsVal'),
        yieldVal: document.getElementById('yieldVal'),
        totalAsset: document.getElementById('totalAsset'),
        totalPrincipal: document.getElementById('totalPrincipal'),
        totalInterest: document.getElementById('totalInterest'),
        fourPercentRule: document.getElementById('fourPercentRule')
    };

    const calcBtn = document.getElementById('calcBtn');

    function formatCurrency(num) {
        return Math.round(num).toLocaleString('ja-JP') + ' 円';
    }

    // バーを動かした時に「上の青い数値テキストだけ」を更新する
    function updateLabelsOnly() {
        displays.initAssetVal.textContent = parseInt(inputs.initAsset.value).toLocaleString();
        displays.monthlyInputVal.textContent = inputs.monthlyInput.value;
        displays.yearsVal.textContent = inputs.years.value;
        
        const yieldValue = parseFloat(inputs.yield.value);
        displays.yieldVal.textContent = yieldValue === 0 ? "0.0" : yieldValue.toFixed(1);
    }

    // ボタンを押した時に実行される「計算＋下の結果反映」ロジック
    function calculateFIRE() {
        const initAsset = parseFloat(inputs.initAsset.value) * 10000;
        const monthlyInput = parseFloat(inputs.monthlyInput.value) * 10000;
        const years = parseInt(inputs.years.value);
        const annualYield = parseFloat(inputs.yield.value) / 100;

        let total = initAsset;
        const monthlyYield = annualYield / 12;
        const totalMonths = years * 12;

        if (monthlyYield === 0) {
            total = initAsset + (monthlyInput * totalMonths);
        } else {
            for (let i = 0; i < totalMonths; i++) {
                total = (total + monthlyInput) * (1 + monthlyYield);
            }
        }

        const totalPrincipal = initAsset + (monthlyInput * totalMonths);
        const totalInterest = Math.max(0, total - totalPrincipal);
        const fourPercent = total * 0.04;

        // 下の結果カードの中身だけを更新
        displays.totalAsset.textContent = formatCurrency(total);
        displays.totalPrincipal.textContent = formatCurrency(totalPrincipal);
        displays.totalInterest.textContent = formatCurrency(totalInterest);
        displays.fourPercentRule.textContent = `${Math.round(fourPercent).toLocaleString()} 円（月額 約${Math.round(fourPercent / 12).toLocaleString()}円）`;
    }

    // スライドバー操作時は、横のテキスト数字だけを同期させる
    Object.values(inputs).forEach(input => {
        input.addEventListener('input', updateLabelsOnly);
    });

    // 🚀 ボタンをクリックしたタイミングでシミュレーション計算を実行
    calcBtn.addEventListener('click', calculateFIRE);

    // 初期読み込み時：表示の同期と、最初の計算結果を一度出しておく
    window.addEventListener('DOMContentLoaded', () => {
        updateLabelsOnly();
        calculateFIRE();
    });
</script>

</body>
</html>
