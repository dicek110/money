<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREシミュレーション</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-12">

    <div class="max-w-6xl mx-auto px-4 py-6">
        <!-- ヘッダー -->
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">🔥 FIRE Dashboard</h1>
            <p class="text-xs text-gray-500 mt-1">数値を動かしてリアルタイムシミュレーション</p>
        </header>

        <!-- コントロールパネル -->
        <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-100 mb-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-sm">
            <div>
                <label class="block font-bold text-gray-700 mb-1">運用資産: <span id="valInvest" class="text-emerald-600">13,000</span>万円</label>
                <input type="range" id="inputInvest" min="5000" max="30000" step="500" value="13000" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">現金保有: <span id="valCash" class="text-slate-600">3,000</span>万円</label>
                <input type="range" id="inputCash" min="0" max="10000" step="500" value="3000" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">運用利回り: <span id="valYield" class="text-blue-600">4.0</span>%</label>
                <input type="range" id="inputYield" min="0" max="10" step="0.5" value="4.0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">インフレ率: <span id="valInflation" class="text-red-500">2.0</span>%</label>
                <input type="range" id="inputInflation" min="0" max="5" step="0.5" value="2.0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>

        <!-- 要約数値 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 text-xs">
            <div class="bg-white p-3 rounded-lg shadow-xs border border-gray-100 text-center">
                <span class="text-gray-400 block mb-1">60歳総資産</span>
                <span id="summary60" class="text-sm font-bold text-slate-800">-</span>
            </div>
            <div class="bg-white p-3 rounded-lg shadow-xs border border-gray-100 text-center">
                <span class="text-gray-400 block mb-1">70歳総資産</span>
                <span id="summary70" class="text-sm font-bold text-slate-800">-</span>
            </div>
            <div class="bg-white p-3 rounded-lg shadow-xs border border-gray-100 text-center">
                <span class="text-gray-400 block mb-1">90歳総資産</span>
                <span id="summary90" class="text-sm font-bold text-slate-800">-</span>
            </div>
            <div class="p-3 rounded-lg shadow-xs border text-center" id="riskCard">
                <span class="text-gray-400 block mb-1">資産枯渇リスク</span>
                <span id="summaryRisk" class="text-sm font-bold">-</span>
            </div>
        </div>

        <!-- グラフ -->
        <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-100 mb-6">
            <h2 class="text-sm font-bold text-gray-800 mb-2">📈 資産推移チャート</h2>
            <div class="relative w-full h-[300px]">
                <canvas id="fireChart"></canvas>
            </div>
        </div>

        <!-- テーブル -->
        <div class="bg-white rounded-xl shadow-xs border border-gray-100 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-100">
                <h2 class="text-sm font-bold text-gray-800">📊 年齢別データ（万円）</h2>
            </div>
            <div class="overflow-x-auto max-h-[400px]">
                <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                    <thead class="bg-gray-50 text-gray-500 font-semibold sticky top-0 border-b border-gray-100 z-10">
                        <tr>
                            <th class="p-2 pl-4">年齢</th>
                            <th class="p-2">生活費</th>
                            <th class="p-2">年金</th>
                            <th class="p-2">運用資産</th>
                            <th class="p-2">現金</th>
                            <th class="p-2 pr-4 text-right">総資産</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-gray-600">
                        <!-- 動的挿入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const inputInvest = document.getElementById('inputInvest');
        const inputCash = document.getElementById('inputCash');
        const inputYield = document.getElementById('inputYield');
        const inputInflation = document.getElementById('inputInflation');

        const valInvest = document.getElementById('valInvest');
        const valCash = document.getElementById('valCash');
        const valYield = document.getElementById('valYield');
        const valInflation = document.getElementById('valInflation');

        const summary60 = document.getElementById('summary60');
        const summary70 = document.getElementById('summary70');
        const summary90 = document.getElementById('summary90');
        const summaryRisk = document.getElementById('summaryRisk');
        const riskCard = document.getElementById('riskCard');
        const tableBody = document.getElementById('tableBody');

        let fireChartInstance = null;

        function runSimulation() {
            const initialInvest = parseFloat(inputInvest.value);
            const initialCash = parseFloat(inputCash.value);
            const yieldRate = parseFloat(inputYield.value) / 100;
            const inflationRate = parseFloat(inputInflation.value) / 100;

            valInvest.textContent = initialInvest.toLocaleString();
            valCash.textContent = initialCash.toLocaleString();
            valYield.textContent = (yieldRate * 100).toFixed(1);
            valInflation.textContent = (inflationRate * 100).toFixed(1);

            let currentInvest = initialInvest;
            let currentCash = initialCash;

            const startAge = 44;
            const endAge = 90;

            const labels = [];
            const investData = [];
            const cashData = [];
            const totalData = [];

            tableBody.innerHTML = '';
            let riskAge = null;
            let total60 = 0, total70 = 0, total90 = 0;

            for (let age = startAge; age <= endAge; age++) {
                if (age > startAge) {
                    currentInvest = currentInvest * (1 + yieldRate);
                } else {
                    currentInvest = currentInvest * (1 + yieldRate);
                }

                let baseCost = (age <= 59) ? 500 : 400;
                let cost = baseCost * Math.pow(1 + inflationRate, age - startAge);

                let pension = 0;
                if (age >= 60) {
                    pension = 100 * Math.pow(1 + inflationRate, age - 60);
                }

                let deficit = cost - pension;
                if (deficit > 0) {
                    if (currentInvest >= deficit) {
                        currentInvest -= deficit;
                    } else {
                        let remainDeficit = deficit - currentInvest;
                        currentInvest = 0;
                        currentCash = Math.max(0, currentCash - remainDeficit);
                    }
                }

                let totalAssets = currentInvest + currentCash;

                if (totalAssets <= 0 && riskAge === null) {
                    riskAge = age;
                }

                if (age === 60) total60 = totalAssets;
                if (age === 70) total70 = totalAssets;
                if (age === 90) total90 = totalAssets;

                labels.push(age + '歳');
                investData.push(Math.round(currentInvest));
                cashData.push(Math.round(currentCash));
                totalData.push(Math.round(totalAssets));

                const row = document.createElement('tr');
                row.className = age % 2 === 0 ? 'bg-gray-50/50' : 'bg-white';
                row.innerHTML = `
                    <td class="p-2 pl-4 font-bold text-gray-900">` + age + `歳</td>
                    <td class="p-2 text-red-500">-` + Math.round(cost).toLocaleString() + `</td>
                    <td class="p-2 text-emerald-600">+` + Math.round(pension).toLocaleString() + `</td>
                    <td class="p-2">` + Math.round(currentInvest).toLocaleString() + `</td>
                    <td class="p-2">` + Math.round(currentCash).toLocaleString() + `</td>
                    <td class="p-2 pr-4 text-right font-bold ` + (totalAssets > 0 ? 'text-slate-900' : 'text-red-600') + `">` + Math.round(totalAssets).toLocaleString() + `</td>
                `;
                tableBody.appendChild(row);
            }

            summary60.textContent = Math.round(total60).toLocaleString() + " 万";
            summary70.textContent = Math.round(total70).toLocaleString() + " 万";
            summary90.textContent = Math.round(total90).toLocaleString() + " 万";
            
            if (riskAge !== null) {
                summaryRisk.textContent = riskAge + "歳で枯渇";
                summaryRisk.className = "text-sm font-bold text-red-700";
                riskCard.className = "bg-red-50 p-3 rounded-lg shadow-xs border border-red-200 text-center";
} else {
summaryRisk.textContent = "なし (安全)";
summaryRisk.className = "text-sm font-bold text-emerald-700";
riskCard.className = "bg-emerald-50 p-3 rounded-lg shadow-xs border border-emerald-200 text-center";
}
if (fireChartInstance) {
fireChartInstance.destroy();
}
const ctx = document.getElementById('fireChart').getContext('2d');
fireChartInstance = new Chart(ctx, {
type: 'line',
data: {
labels: labels,
datasets: [
{ label: '総資産', data: totalData, borderColor: '#0284c7', backgroundColor: 'rgba(2, 132, 199, 0.05)', fill: true, tension: 0.1, borderWidth: 2 },
{ label: '運用', data: investData, borderColor: '#10b981', fill: false, tension: 0.1, borderWidth: 1.5 },
{ label: '現金', data: cashData, borderColor: '#94a3b8', fill: false, tension: 0.1, borderWidth: 1.5 }
]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10 } } }
},
scales: {
y: { beginAtZero: true, ticks: { font: { size: 9 }, callback: function(value) { return value.toLocaleString() + '万'; } } },
x: { ticks: { font: { size: 9 }, maxRotation: 45 } }
}
}
});
}
[inputInvest, inputCash, inputYield, inputInflation].forEach(input => {
input.addEventListener('input', runSimulation);
});
runSimulation();
