<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREシミュレーション</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js (グラフ描画用) -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-4 pb-12 text-xs font-sans antialiased">

    <header class="mb-4 text-center">
        <h1 class="text-xl font-extrabold text-slate-900">🔥 FIRE Dashboard</h1>
        <p class="text-[10px] text-gray-400 mt-1">数値を動かして将来の資産をリアルタイムにシミュレーション</p>
    </header>

    <!-- コントロールパネル (スライダーエリア) -->
    <div class="bg-white p-3 rounded-xl border border-gray-100 mb-4 grid grid-cols-2 gap-3 font-bold text-gray-700">
        <div>
            <label class="block mb-1">運用資産: <span id="vInv" class="text-emerald-600">13,000</span>万</label>
            <input type="range" id="iInv" min="5000" max="30000" step="500" value="13000" class="w-full h-1 bg-gray-200 rounded cursor-pointer" oninput="sim()">
        </div>
        <div>
            <label class="block mb-1">現金保有: <span id="vCash" class="text-slate-600">3,000</span>万</label>
            <input type="range" id="iCash" min="0" max="10000" step="500" value="3000" class="w-full h-1 bg-gray-200 rounded cursor-pointer" oninput="sim()">
        </div>
        <div>
            <label class="block mb-1">運用利回り: <span id="vYld" class="text-blue-600">4.0</span>%</label>
            <input type="range" id="iYld" min="0" max="10" step="0.5" value="4.0" class="w-full h-1 bg-gray-200 rounded cursor-pointer" oninput="sim()">
        </div>
        <div>
            <label class="block mb-1">インフレ率: <span id="vInf" class="text-red-500">2.0</span>%</label>
            <input type="range" id="iInf" min="0" max="5" step="0.5" value="2.0" class="w-full h-1 bg-gray-200 rounded cursor-pointer" oninput="sim()">
        </div>
    </div>

    <!-- ハイライトカード (要約数値) -->
    <div class="grid grid-cols-4 gap-2 mb-4 font-bold text-center text-[10px]">
        <div class="bg-white p-2 rounded border border-gray-100">
            <p class="text-gray-400 mb-1">60歳総資産</p>
            <span id="s60" class="text-slate-800 text-xs font-extrabold">-</span>
        </div>
        <div class="bg-white p-2 rounded border border-gray-100">
            <p class="text-gray-400 mb-1">70歳総資産</p>
            <span id="s70" class="text-slate-800 text-xs font-extrabold">-</span>
        </div>
        <div class="bg-white p-2 rounded border border-gray-100">
            <p class="text-gray-400 mb-1">90歳総資産</p>
            <span id="s90" class="text-slate-800 text-xs font-extrabold">-</span>
        </div>
        <div id="rCard" class="p-2 rounded border border-gray-200 bg-white">
            <p class="text-gray-400 mb-1">枯渇リスク</p>
            <span id="sRisk" class="text-xs font-extrabold">-</span>
        </div>
    </div>

    <!-- グラフエリア -->
    <div class="bg-white p-3 rounded-xl border border-gray-100 mb-4 h-[260px] relative">
        <canvas id="fChart"></canvas>
    </div>

    <!-- データテーブル -->
    <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto max-h-[300px]">
            <table class="w-full text-left border-collapse text-[11px] whitespace-nowrap">
                <thead class="bg-gray-50 text-gray-500 font-bold sticky top-0 border-b border-gray-100">
                    <tr>
                        <th class="p-2 pl-3">年齢</th>
                        <th class="p-2">生活費</th>
                        <th class="p-2">年金</th>
                        <th class="p-2">運用資産</th>
                        <th class="p-2">現金</th>
                        <th class="p-2 pr-3 text-right">総資産</th>
                    </tr>
                </thead>
                <tbody id="tBody" class="divide-y divide-gray-100 text-gray-600">
                    <!-- 動的に挿入 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let chart = null;

        function sim() {
            const dom = {
                iInv: document.getElementById('iInv'),
                iCash: document.getElementById('iCash'),
                iYld: document.getElementById('iYld'),
                iInf: document.getElementById('iInf'),
                vInv: document.getElementById('vInv'),
                vCash: document.getElementById('vCash'),
                vYld: document.getElementById('vYld'),
                vInf: document.getElementById('vInf'),
                s60: document.getElementById('s60'),
                s70: document.getElementById('s70'),
                s90: document.getElementById('s90'),
                sRisk: document.getElementById('sRisk'),
                rCard: document.getElementById('rCard'),
                tBody: document.getElementById('tBody')
            };

            // 要素が取得できない場合は処理をスキップ
            if (!dom.iInv || !dom.iCash || !dom.iYld || !dom.iInf) return;

            const initInv = parseFloat(dom.iInv.value);
            const initCash = parseFloat(dom.iCash.value);
            const yld = parseFloat(dom.iYld.value) / 100;
            const inf = parseFloat(dom.iInf.value) / 100;

            // スライダー横の数値表示を更新
            dom.vInv.textContent = initInv.toLocaleString();
            dom.vCash.textContent = initCash.toLocaleString();
            dom.vYld.textContent = (yld * 100).toFixed(1);
            dom.vInf.textContent = (inf * 100).toFixed(1);

            let cInv = initInv;
            let cCash = initCash;
            let rAge = null;
            let t60 = 0, t70 = 0, t90 = 0;

            const lbls = [];
            const dInv = [];
            const dCash = [];
            const dTot = [];

            dom.tBody.innerHTML = '';

            for (let a = 44; a <= 90; a++) {
                if (a > 44) {
                    cInv = cInv * (1 + yld);
                } else {
                    cInv = cInv * (1 + yld);
                }

                let baseCost = (a <= 59) ? 500 : 400;
                let cost = baseCost * Math.pow(1 + inf, a - 44);

                let pen = 0;
                if (a >= 60) {
                    pen = 100 * Math.pow(1 + inf, a - 60);
                }

                let def = cost - pen;
                if (def > 0) {
                    if (cInv >= def) {
                        cInv -= def;
                    } else {
                        let remainDef = def - cInv;
                        cInv = 0;
                        cCash = Math.max(0, cCash - remainDef);
                    }
                }

                let tot = cInv + cCash;

                if (tot <= 0 && rAge === null) {
                    rAge = a;
                }

                if (a === 60) t60 = tot;
                if (a === 70) t70 = tot;
                if (a === 90) t90 = tot;

                lbls.push(a + '歳');
                dInv.push(Math.round(cInv));
                dCash.push(Math.round(cCash));
                dTot.push(Math.round(tot));

                const row = document.createElement('tr');
                row.className = a % 2 === 0 ? 'bg-gray-50/50' : 'bg-white';
                row.innerHTML = `
                    <td class="p-2 pl-3 font-bold text-gray-900">${a}歳</td>
                    <td class="p-2 text-red-500">-${Math.round(cost).toLocaleString()}</td>
                    <td class="p-2 text-emerald-600">+${Math.round(pen).toLocaleString()}</td>
                    <td class="p-2">${Math.round(cInv).toLocaleString()}</td>
                    <td class="p-2">${Math.round(cCash).toLocaleString()}</td>
                    <td class="p-2 pr-3 text-right font-bold ${tot > 0 ? 'text-slate-900' : 'text-red-600'}">${Math.round(tot).toLocaleString()}</td>
                `;
                dom.tBody.appendChild(row);
            }

            // カードの値を更新
            dom.s60.textContent = Math.round(t60).toLocaleString() + "万";
            dom.s70.textContent = Math.round(t70).toLocaleString() + "万";
            dom.s90.textContent = Math.round(t90).toLocaleString() + "万";

            if (rAge !== null) {
                dom.sRisk.textContent = rAge + "歳枯渇";
                dom.rCard.className = "p-2 rounded border bg-red-50 border-red-200 text-red-700 font-bold";
            } else {
                dom.sRisk.textContent = "なし";
                dom.rCard.className = "p-2 rounded border bg-emerald-50 border-emerald-200 text-emerald-700 font-bold";
            }

            // グラフの破棄と再描画
            if (chart) {
                chart.destroy();
            }

            const ctx = document.getElementById('fChart');
            if (ctx) {
                chart = new Chart(ctx.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: lbls,
                        datasets: [
                            { label: '総資産', data: dTot, borderColor: '#0284c7', backgroundColor: 'rgba(2, 132, 199, 0.05)', fill: true, borderWidth: 2, pointRadius: 1 },
                            { label: '運用', data: dInv, borderColor: '#10b981', fill: false, borderWidth: 1.5, pointRadius: 0 },
                            { label: '現金', data: dCash, borderColor: '#94a3b8', fill: false, borderWidth: 1.5, pointRadius: 0 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { boxWidth: 10, font: { size: 9 } } }
                        },
                        scales: {
                            y: { beginAtZero: true, ticks: { font: { size: 8 }, callback: function(v) { return v.toLocaleString() + '万'; } } },
