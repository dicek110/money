<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格FIREシミュレーター</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --p: #2563eb; --bg: #f1f5f9; --txt: #1e293b; --b: #e2e8f0; }
        body { font-family: sans-serif; background: var(--bg); color: var(--txt); padding:15px; margin:0; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: var(--p); font-size: 1.5rem; margin-bottom: 15px; }
        .sec { font-size: 0.95rem; font-weight: bold; margin: 15px 0 5px 0; color: #475569; border-left: 4px solid var(--p); padding-left: 8px; }
        .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .row { margin-bottom: 12px; }
        .lbl-wp { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.85rem; margin-bottom: 2px; }
        input[type="range"] { width: 100%; height: 6px; background: var(--b); border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--p); cursor: pointer; }
        .btn { background: var(--p); color: #fff; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .res { background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid var(--b); }
        .r-lbl { font-size: 0.75rem; color: #64748b; }
        .r-val { font-size: 1rem; font-weight: bold; }
        .chart-wp { position: relative; width: 100%; height: 280px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔥 FIREシミュレーター</h1>
    <div class="card">
        <div class="sec" style="margin-top:0;">基本情報</div>
        <div class="row"><div class="lbl-wp"><label for="cA">現在の年齢</label><span><span id="cAV">35</span>歳</span></div><input type="range" id="cA" min="20" max="65" value="35"></div>
        <div class="row"><div class="lbl-wp"><label for="rA">リタイア年齢</label><span><span id="rAV">50</span>歳</span></div><input type="range" id="rA" min="25" max="70" value="50"></div>
        <div class="row"><div class="lbl-wp"><label for="inc">現在の年収</label><span><span id="incV">600</span>万円</span></div><input type="range" id="inc" min="200" max="2000" step="50" value="600"></div>
        <div class="sec">初期資産（MAX 2億円）</div>
        <div class="row"><div class="lbl-wp"><label for="ivA">運用資産</label><span><span id="ivAV">2,000</span>万円</span></div><input type="range" id="ivA" min="0" max="20000" step="500" value="2000"></div>
        <div class="row"><div class="lbl-wp"><label for="csA">現金保有</label><span><span id="csAV">1,000</span>万円</span></div><input type="range" id="csA" min="0" max="10000" step="100" value="1000"></div>
        <div class="row"><div class="lbl-wp"><label for="idc">現在のiDeCo残高</label><span><span id="idcV">300</span>万円</span></div><input type="range" id="idc" min="0" max="3000" step="50" value="300"></div>
        <div class="row"><div class="lbl-wp"><label for="yld">運用利回り</label><span><span id="yldV">4.0</span>%</span></div><input type="range" id="yld" min="0" max="15" step="0.1" value="4.0"></div>
        <div class="sec">生活費・年金</div>
        <div class="row"><div class="lbl-wp"><label for="cB6">60歳前の年間生活費</label><span><span id="cB6V">400</span>万円</span></div><input type="range" id="cB6" min="100" max="1000" step="10" value="400"></div>
        <div class="row"><div class="lbl-wp"><label for="cA6">60歳以降の年間生活費</label><span><span id="cA6V">300</span>万円</span></div><input type="range" id="cA6" min="100" max="1000" step="10" value="300"></div>
        <div class="row"><div class="lbl-wp"><label for="pen">年金（65歳基準・年額）</label><span><span id="penV">150</span>万円</span></div><input type="range" id="pen" min="0" max="400" step="10" value="150"></div>
        <div class="row"><div class="lbl-wp"><label for="pA">年金受給開始年齢</label><span><span id="pAV">65</span>歳</span></div><input type="range" id="pA" min="60" max="75" value="65"></div>
    </div>
    <button id="btn" class="btn">シミュレーションを実行する</button>
    <div class="card">
        <div class="sec" style="margin-top:0;">結果</div>
        <div class="grid">
            <div class="res"><div class="r-lbl">60歳総資産</div><div class="r-val" id="o60">---</div></div>
            <div class="res"><div class="r-lbl">70歳総資産</div><div class="r-val" id="o70">---</div></div>
            <div class="res"><div class="r-lbl">90歳総資産</div><div class="r-val" id="o90">---</div></div>
            <div class="res"><div class="r-lbl">資産寿命</div><div class="r-val" id="risk">---</div></div>
        </div>
        <div class="chart-wp"><canvas id="chart"></canvas></div>
    </div>
</div>
<script>
    const ids = ['cA','rA','inc','ivA','csA','idc','yld','cB6','cA6','pen','pA'];
    const el = {}, disp = {}; ids.forEach(id => { el[id] = document.getElementById(id); disp[id] = document.getElementById(id+'V'); });
    const out = { 60: document.getElementById('o60'), 70: document.getElementById('o70'), 90: document.getElementById('o90'), risk: document.getElementById('risk') };
    let ctxChart = null;
    function fmt(y) {
        if (y <= 0) return "0円"; const m = Math.round(y / 10000);
        if (m >= 10000) { const o = Math.floor(m / 10000); const r = m % 10000; return r > 0 ? `${o}億${r.toLocaleString()}万円` : `${o}億円`; }
        return `${m.toLocaleString()}万円`;
    }
    function sync() {
        if (parseInt(el.rA.value) < parseInt(el.cA.value)) el.rA.value = el.cA.value;
        ids.forEach(id => { let v = parseFloat(el[id].value); disp[id].textContent = (id==='yld') ? v.toFixed(1) : v.toLocaleString(); });
    }
    function calc() {
        const cA = parseInt(el.cA.value), rA = parseInt(el.rA.value), pA = parseInt(el.pA.value);
        const inc = parseFloat(el.inc.value)*10000, cB = parseFloat(el.cB6.value)*10000, cA6 = parseFloat(el.cA6.value)*10000;
        let inv = parseFloat(el.ivA.value)*10000, cash = parseFloat(el.csA.value)*10000, idc = parseFloat(el.idc.value)*10000;
        const r = parseFloat(el.yld.value)/100, pB = parseFloat(el.pen.value)*10000;
        let pR = 1.0; if(pA < 65) pR -= (65 - pA)*12*0.004; else if(pA > 65) pR += (pA - 65)*12*0.007;
        const pension = pB * pR;
        let lbs = [], dInv = [], dCs = [], die = 0;
        for (let a = cA; a <= 100; a++) {
            if (a === 60) { cash += idc; idc = 0; }
            let tot = inv + cash + idc; lbs.push(a + "歳"); dInv.push(Math.round(inv)); dCs.push(Math.round(cash + idc));
            if (a === 60) out[60].textContent = fmt(tot); if (a === 70) out[70].textContent = fmt(tot); if (a === 90) out[90].textContent = fmt(tot);
            if (tot <= 0 && die === 0) die = a;
            if (a < rA) {
                let s = inc - cB; if (s > 0) inv += s; else cash += s;
                inv *= (1 + r); if (a < 60) idc *= (1 + r);
            } else {
                let cost = (a < 60) ? cB : cA6; if (a >= pA) cash += pension;
                if (inv >= cost) { inv -= cost; } else { let rem = cost - inv; inv = 0; cash -= rem; }
                if (inv > 0) inv *= (1 + r); if (cash < 0) cash = 0; if (a < 60) idc *= (1 + r);
            }
        }
        if (cA > 60) out[60].textContent = "対象外"; if (cA > 70) out[70].textContent = "対象外"; if (cA > 90) out[90].textContent = "対象外";
        if (die > 0) { out.risk.textContent = `${die}歳で枯渇`; out.risk.style.color = "#dc2626"; } else { out.risk.textContent = "100歳クリア"; out.risk.style.color = "#16a34a"; }
        if (ctxChart) ctxChart.destroy();
        ctxChart = new Chart(document.getElementById('chart').getContext('2d'), {
            type: 'line', data: { labels: lbs, datasets: [
                { label: '運用資産', data: dInv, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.4)', fill: true, tension: 0.1, pointRadius:0 },
                { label: '現金口座', data: dCs, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.4)', fill: true, tension: 0.1, pointRadius:0 }
            ]}, options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, ticks: { callback: function(v) { return (v / 10000).toLocaleString() + '万'; } } } } }
        });
    }
    ids.forEach(id => el[id].addEventListener('input', sync));
    document.getElementById('btn').addEventListener('click', calc);
    window.addEventListener('DOMContentLoaded', () => { sync(); calc(); });
</script>
</body>
</html>
