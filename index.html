<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREシミュレーション・ダッシュボード</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group:last-child { margin-bottom: 0; }
        .label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .value-display {
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        .result-title {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .breakdown {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 FIREシミュレーション</h1>
    
    <div class="grid">
        <!-- 入力コントロール -->
        <div class="card">
            <div class="control-group">
                <div class="label-wrapper">
                    <label for="initAsset">現在の資産</label>
                    <span class="value-display"><span id="initAssetVal">3,000</span>万円</span>
                </div>
                <input type="range" id="initAsset" min="0" max="10000" step="100" value="3000">
            </div>

            <div class="control-group">
                <div class="label-wrapper">
                    <label for="monthlyInput">毎月の積立額</label>
                    <span class="value-display"><span id="monthlyInputVal">10</span>万円</span>
                </div>
                <input type="range" id="monthlyInput" min="0" max="100" step="1" value="10">
            </div>

            <div class="control-group">
                <div class="label-wrapper">
                    <label for="years">積立・運用期間</label>
                    <span class="value-display"><span id="yearsVal">15</span>年</span>
                </div>
                <input type="range" id="years" min="1" max="40" step="1" value="15">
            </div>

            <div class="control-group">
                <div class="label-wrapper">
                    <label for="yield">想定年利 (運用リターン)</label>
                    <span class="value-display"><span id="yieldVal">5.0</span>%</span>
                </div>
                <input type="range" id="yield" min="0" max="15" step="0.5" value="5">
            </div>
        </div>

        <!-- 計算結果表示 -->
        <div class="card" style="display: flex; flex-direction: column; justify-content: center;">
            <div class="result-title">期間終了時の想定総資産</div>
            <div class="result-value" id="totalAsset">--- 円</div>
            
            <div class="breakdown">
                <div class="breakdown-item">
                    <span>投資元本総額:</span>
                    <span id="totalPrincipal">--- 円</span>
                </div>
                <div class="breakdown-item">
                    <span>運用利益（複利効果）:</span>
                    <span id="totalInterest" style="color: #10b981; font-weight: bold;">--- 円</span>
                </div>
                <div class="breakdown-item" style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--border-color);">
                    <span>4%ルールでの年間取崩し目安:</span>
                    <span id="fourPercentRule" style="font-weight: bold;">--- 円</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // DOM要素の取得
    const inputs = {
        initAsset: document.getElementById('initAsset'),
        monthlyInput: document.getElementById('monthlyInput'),
        years: document.getElementById('years'),
        yield: document.getElementById('yield')
    };

    const displays = {
        initAssetVal: document.getElementById('initAssetVal'),
        monthlyInputVal: document.getElementById('monthlyInputVal'),
        yearsVal: document.getElementById('yearsVal'),
        yieldVal: document.getElementById('yieldVal'),
        totalAsset: document.getElementById('totalAsset'),
        totalPrincipal: document.getElementById('totalPrincipal'),
        totalInterest: document.getElementById('totalInterest'),
        fourPercentRule: document.getElementById('fourPercentRule')
    };

    // 通貨フォーマット関数 (例: 12,345,678円)
    function formatCurrency(num) {
        return Math.round(num).toLocaleString('ja-JP') + ' 円';
    }

    // 計算メインロジック
    function calculateFIRE() {
        // スライドバーの値を取得（単位変換含む）
        const initAsset = parseFloat(inputs.initAsset.value) * 10000; // 万円 -> 円
        const monthlyInput = parseFloat(inputs.monthlyInput.value) * 10000; // 万円 -> 円
        const years = parseInt(inputs.years.value);
        const annualYield = parseFloat(inputs.yield.value) / 100;

        // スライドバー横の数字表示をリアルタイム更新
        displays.initAssetVal.textContent = parseInt(inputs.initAsset.value).toLocaleString();
        displays.monthlyInputVal.textContent = inputs.monthlyInput.value;
        displays.yearsVal.textContent = inputs.years.value;
        displays.yieldVal.textContent = annualYield === 0 ? "0.0" : parseFloat(inputs.yield.value).toFixed(1);

        // 複利計算
        let total = initAsset;
        const monthlyYield = annualYield / 12;
        const totalMonths = years * 12;

        if (monthlyYield === 0) {
            total = initAsset + (monthlyInput * totalMonths);
        } else {
            for (let i = 0; i < totalMonths; i++) {
                total = (total + monthlyInput) * (1 + monthlyYield);
            }
        }

        // 元本と利益の計算
        const totalPrincipal = initAsset + (monthlyInput * totalMonths);
        const totalInterest = Math.max(0, total - totalPrincipal);
        const fourPercent = total * 0.04;

        // 結果画面の空白を埋める（UIへ反映）
        displays.totalAsset.textContent = formatCurrency(total);
        displays.totalPrincipal.textContent = formatCurrency(totalPrincipal);
        displays.totalInterest.textContent = formatCurrency(totalInterest);
        displays.fourPercentRule.textContent = formatCurrency(fourPercent) + `（月額 約${Math.round(fourPercent / 12).toLocaleString()}円）`;
    }

    // すべての入力イベントにリスナーを設定（inputイベントでリアルタイム連動）
    Object.values(inputs).forEach(input => {
        input.addEventListener('input', calculateFIRE);
    });

    // 初期読み込み時に一度計算を走らせる
    window.addEventListener('DOMContentLoaded', calculateFIRE);
</script>

</body>
</html>
