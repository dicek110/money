<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE</title>
    <style>
        body { font-family:sans-serif; background:#f1f5f9; color:#1e293b; padding:15px; margin:0; font-size:13px; }
        .card { background:#fff; border-radius:12px; padding:12px; box-shadow:0 4px 6px rgba(0,0,0,0.05); margin-bottom:15px; }
        .row { margin-bottom:10px; }
        .lbl-wp { display:flex; justify-content:space-between; font-weight:bold; font-size:0.85rem; }
        input { width:100%; height:6px; background:#e2e8f0; border-radius:3px; outline:none; -webkit-appearance:none; }
        input::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#2563eb; cursor:pointer; }
        .btn { width:100%; color:#fff; border:none; padding:12px; font-size:0.9rem; font-weight:bold; border-radius:8px; cursor:pointer; margin-bottom:10px; }
        table { width:100%; border-collapse:collapse; text-align:right; font-size:0.8rem; min-width:480px; }
        th, td { padding:6px 8px; border-bottom:1px solid #e2e8f0; } th { background:#f8fafc; color:#475569; }
    </style>
</head>
<body>
<div style="max-width:600px; margin:0 auto;">
    <h1 style="text-align:center; color:#2563eb; font-size:1.4rem; margin:10px 0;">🔥 FIREシミュレーター</h1>
    <div class="card">
        <div style="font-weight:bold; margin-bottom:5px; color:#475569;">▼ 住居区分の選択</div>
        <div style="display:flex; gap:15px; margin-bottom:5px; font-weight:bold;">
            <label><input type="radio" name="hType" value="loan" checked style="width:auto; -webkit-appearance:auto;"> ローンあり</label>
            <label><input type="radio" name="hType" value="rent" style="width:auto; -webkit-appearance:auto;"> 賃貸・その他</label>
        </div>
    </div>
    <div class="card" id="inputs"></div>
    <div style="display:flex; gap:10px;">
        <button id="btn" class="btn" style="background:#2563eb;">結果を計算する</button>
        <button id="backBtn" class="btn" style="background:#10b981;">必要労働年数を逆算</button>
    </div>
    <div id="gRes" style="background:#eff6ff; border:2px solid #bfdbfe; color:#1e40af; border-radius:10px; padding:12px; text-align:center; font-weight:bold; display:none; margin-bottom:15px;"></div>
    <div class="card">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; font-weight:bold;" id="sums"></div>
        <div style="overflow-x:auto;"><table><thead><tr><th style="text-align:center;">年齢</th><th>総資産</th><th>運用資産</th><th>現金枠</th><th>生活費</th><th style="color:#ef4444;">引かれた税金</th></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
</div>
<!-- 【前半のコピーはココまで】次のメッセージで後半（プログラム部分）を送ります -->
<script>
const CONFIG = [
    {id:'cA', name:'現在の年齢', min:20, max:65, val:35, unit:'歳'},
    {id:'rA', name:'リタイア年齢', min:25, max:70, val:50, unit:'歳'},
    {id:'inc', name:'現在の年収 (額面)', min:200, max:2000, step:50, val:600, m:true},
    {id:'ivA', name:'運用資産 (初期)', min:0, max:20000, step:500, val:2000, m:true},
    {id:'csA', name:'現金保有 (初期)', min:0, max:10000, step:100, val:1000, m:true},
    {id:'idc', name:'現在のiDeCo残高', min:0, max:3000, step:50, val:300, m:true},
    {id:'yld', name:'運用利回り', min:0, max:15, step:0.1, val:4.0, p:true},
    {id:'inf', name:'インフレ率', min:0, max:10, step:0.1, val:2.0, p:true},
    {id:'cB6', name:'60歳前の年間生活費 (住居除く)', min:100, max:1000, step:10, val:300, m:true},
    {id:'cA6', name:'60歳以降の年間生活費 (住居除く)', min:100, max:1000, step:10, val:200, m:true},
    {id:'lBal', name:'住宅ローン残高', min:0, max:8000, step:100, val:3000, m:true, g:'loan'},
    {id:'lPay', name:'住宅ローンの年間返済額', min:0, max:400, step:5, val:120, m:true, g:'loan'},
    {id:'lRat', name:'住宅ローン金利', min:0, max:5, step:0.05, val:0.5, p:true, g:'loan'},
    {id:'rMon', name:'家賃月額', min:0, max:40, step:1, val:10, m:true, g:'rent'},
    {id:'pen', name:'年金 (65歳基準・年額)', min:0, max:400, step:10, val:150, m:true},
    {id:'pA', name:'年金受給開始年齢', min:60, max:75, val:65, unit:'歳'}
];

const inpCont = document.getElementById('inputs');
CONFIG.forEach(c => { inpCont.innerHTML += `<div class="row" id="row_${c.id}"><div class="lbl-wp"><label for="${c.id}">${c.name}</label><span><span id="${c.id}V">-</span></span></div><input type="range" id="${c.id}" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${c.val}"></div>`; });

const sumCont = document.getElementById('sums');
const summaryKeys = String("60,70,90,risk").split(",");
summaryKeys.forEach(k => { sumCont.innerHTML += `<div style="background:#f8fafc; padding:8px; border-radius:6px; border:1px solid #e2e8f0;"><div style="font-size:0.75rem; color:#64748b;">${k==='risk'?'資産寿命':k+'歳総資産'}</div><div id="o${k}" style="font-size:0.95rem;">---</div></div>`; });

const el = {}, disp = {}; CONFIG.forEach(c => { el[c.id] = document.getElementById(c.id); disp[c.id] = document.getElementById(c.id+'V'); });
const out = { 60: document.getElementById('o60'), 70: document.getElementById('o70'), 90: document.getElementById('o90'), risk: document.getElementById('orisk') };
const tb = document.getElementById('tb'), gRes = document.getElementById('gRes');

function fmt(n) {
    if (n <= 0) return "0円";
    if (n >= 10000) { const o = Math.floor(n / 10000), r = n % 10000; return r > 0 ? `${o}億${r}万円` : `${o}億円`; }
    return `${n}万円`;
}
function fmtT(y) { return y <= 0 ? "0万円" : Math.round(y / 10000).toLocaleString() + "万円"; }

function toggleHousing() {
    const type = document.querySelector('input[name="hType"]:checked').value;
    CONFIG.forEach(c => { if (c.g) document.getElementById('row_' + c.id).style.display = (c.g === type) ? 'block' : 'none'; });
}

function sync() {
    if (parseInt(el.rA.value) < parseInt(el.cA.value)) el.rA.value = el.cA.value;
    CONFIG.forEach(c => {
        let v = parseFloat(el[c.id].value);
        if (c.m) disp[c.id].textContent = (c.id === 'rMon') ? v + "万 (年" + (v*12) + "万)" : fmt(v);
        else if (c.p || c.id === 'lRat') disp[c.id].textContent = v.toFixed(c.id==='lRat'?2:1) + "%";
        else disp[c.id].textContent = v + c.unit;
    });
}

function runCore(targetRA) {
    const cA = parseInt(el.cA.value), pA = parseInt(el.pA.value);
    const inc = parseFloat(el.inc.value)*10000, cB = parseFloat(el.cB6.value)*10000, cA6 = parseFloat(el.cA6.value)*10000;
    let inv = parseFloat(el.ivA.value)*10000, cash = parseFloat(el.csA.value)*10000, idc = parseFloat(el.idc.value)*10000;
    const r = parseFloat(el.yld.value)/100, inf = parseFloat(el.inf.value)/100, pB = parseFloat(el.pen.value)*10000;
    
    const hType = document.querySelector('input[name="hType"]:checked').value;
    let currLoan = parseFloat(el.lBal.value)*10000, lPay = parseFloat(el.lPay.value)*10000, lRat = parseFloat(el.lRat.value)/100, rAnn = parseFloat(el.rMon.value)*12*10000;

    let totalPrincipal = inv; 
    let pR = 1.0; if(pA < 65) pR -= (65 - pA)*12*0.004; else if(pA > 65) pR += (pA - 65)*12*0.007;
    const pension = pB * pR; let die = 0, results = [];

    for (let a = cA; a <= 100; a++) {
        let taxIncurred = 0; if (a === 60) { cash += idc; idc = 0; }
        let baseCost = ((a < 60) ? cB : cA6) * Math.pow(1 + inf, a - cA), hCost = 0;

        if (hType === 'loan') {
            if (currLoan > 0) {
                hCost = lPay;
                let pPaid = lPay - (currLoan * lRat);
                currLoan -= (pPaid > 0 ? pPaid : 0); if (currLoan < 0) currLoan = 0;
            }
        } else { hCost = rAnn * Math.pow(1 + inf, a - cA); }

        let cost = baseCost + hCost, tot = inv + cash + idc;
        if (tot <= 0 && die === 0) die = a;

        if (a < targetRA) {
            let tax = inc * 0.2; taxIncurred = tax; let s = (inc - tax) - cost;
            if (s > 0) { inv += s; totalPrincipal += s; } else cash += s;
            inv *= (1 + r); if (a < 60) idc *= (1 + r);
        } else {
            if (a >= pA) cash += pension;
            if (inv >= cost) {
                let profitRatio = Math.max(0, (inv - totalPrincipal) / inv);
                let taxOnProfit = cost * profitRatio * 0.20315;
                taxIncurred = taxOnProfit; inv -= (cost + taxOnProfit);
            } else {
                let rem = cost - inv;
                if (inv > 0) {
                    let profitRatio = Math.max(0, (inv - totalPrincipal) / inv);
                    let taxOnProfit = inv * profitRatio * 0.20315;
                    taxIncurred = taxOnProfit; inv = 0; cash -= (rem + taxOnProfit);
                } else { cash -= rem; }
            }
            if (inv > 0) inv *= (1 + r); if (cash < 0) cash = 0; if (a < 60) idc *= (1 + r);
        }
        results.push({a, tot, inv, cash, idc, cost, taxIncurred});
    }
    return { die, results };
}

function calc() {
    gRes.style.display = "none"; const rA = parseInt(el.rA.value), cA = parseInt(el.cA.value);
    const { die, results } = runCore(rA); tb.innerHTML = "";
    results.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="text-align:center;font-weight:bold;">${d.a==rA?d.a+'歳🚀':d.a+'歳'}</td><td style="font-weight:bold;color:#2563eb;">${fmtT(d.tot)}</td><td>${fmtT(d.inv)}</td><td>${fmtT(d.cash+d.idc)}</td><td>${fmtT(d.cost)}</td><td style="color:#ef4444;font-weight:bold;">${d.taxIncurred>0?fmtT(d.taxIncurred):'-'}</td>`;
        tb.appendChild(tr);
    });
    
    const targetAges = String("60,70,90").split(",");
    targetAges.forEach(ageStr => {
        const age = parseInt(ageStr); const d = results.find(x => x.a === age);
        if (out[age]) out[age].textContent = d ? fmt(Math.round(d.tot / 10000)) : "---";
        if (cA > age && out[age]) out[age].textContent = "対象外";
    });
    
    if (die > 0) { out.risk.textContent = `${die}歳で枯渇`; out.risk.style.color = "#dc2626"; }
    else { out.risk.textContent = "100歳クリア"; out.risk.style.color = "#16a34a"; }
}

function reverseCalc() {
    const cA = parseInt(el.cA.value); let targetAge = -1;
    for (let checkRA = cA; checkRA <= 70; checkRA++) { if (runCore(checkRA).die === 0) { targetAge = checkRA; break; } }
    gRes.style.display = "block";
    if (targetAge === cA) gRes.innerHTML = "🎉 今すぐリタイアしても100歳まで資産が持ちます！";
    else if (targetAge > cA) { gRes.innerHTML = `🎯 100歳まで生き残るには【最低 ${targetAge}歳】まで働く必要があります！`; el.rA.value = targetAge; }
    else gRes.innerHTML = "⚠️ 70歳まで働いても100歳までに資産が枯渇する可能性があります。";
    sync(); calc();
}

CONFIG.forEach(c => el[c.id].addEventListener('input', sync));
document.getElementsByName('hType').forEach(r => r.addEventListener('change', () => { toggleHousing(); sync(); calc(); }));
document.getElementById('btn').addEventListener('click', calc);
document.getElementById('backBtn').addEventListener('click', reverseCalc);
window.addEventListener('DOMContentLoaded', () => { toggleHousing(); sync(); calc(); });
</script>
</body>
</html>
