<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            color: #111;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .description {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .label-wrapper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 1rem;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: #cbd5e1;
            border-radius: 3px;
            outline: none;
        }
        /* 実行ボタンのスタイリング */
        .btn-container {
            margin: 25px 0;
            text-align: center;
        }
        .calc-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        .calc-btn:hover {
            background-color: #1e88e5;
        }
        .calc-btn:active {
            transform: scale(0.98);
        }
        .result-section {
            margin-top: 20px;
            border-top: 2px solid #e2e8f0;
            padding-top: 20px;
        }
        .result-group {
            margin-bottom: 20px;
        }
        .result-label {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #000;
            padding-left: 5px;
        }
        .table-header-preview {
            margin-top: 40px;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            gap: 12px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>🔥 FIRE Dashboard</h1>
    <div class="description">
        数値を動かして将来の資産をシミュレーション
    </div>

    <!-- 入力スライドバー群 -->
    <div class="control-group">
        <div class="label-wrapper">
            <span>運用資産: <span id="investAssetVal">13,000</span>万</span>
        </div>
        <div class="slider-container">
            <input type="range" id="investAsset" min="0" max="30000" step="500" value="13000">
        </div>
    </div>

    <div class="control-group">
        <div class="label-wrapper">
            <span>現金保有: <span id="cashAssetVal">3,000</span>万</span>
        </div>
        <div class="slider-container">
            <input type="range" id="cashAsset" min="0" max="10000" step="100" value="3000">
        </div>
    </div>

    <div class="control-group">
        <div class="label-wrapper">
            <span>運用利回り: <span id="yieldVal">4.0</span>%</span>
        </div>
        <div class="slider-container">
            <input type="range" id="yield" min="0" max="15" step="0.1" value="4.0">
        </div>
    </div>

    <div class="control-group">
        <div class="label-wrapper">
            <span>インフレ率: <span id="inflationVal">2.0</span>%</span>
        </div>
        <div class="slider-container">
            <input type="range" id="inflation" min="0" max="10" step="0.1" value="2.0">
        </div>
    </div>

    <!-- ✨ 追加：実行ボタン -->
    <div class="btn-container">
        <button id="calcBtn" class="calc-btn">シミュレーションを実行する</button>
    </div>

    <!-- 結果出力群 -->
    <div class="result-section">
        <div class="result-group">
            <div class="result-label">60歳総資産</div>
            <div class="result-value" id="asset60">--- 円</div>
        </div>

        <div class="result-group">
            <div class="result-label">70歳総資産</div>
            <div class="result-value" id="asset70">--- 円</div>
        </div>

        <div class="result-group">
            <div class="result-label">90歳総資産</div>
            <div class="result-value" id="asset90">--- 円</div>
        </div>

        <div class="result-group">
            <div class="result-label">枯渇リスク</div>
            <div class="result-value" id="riskStatus">---</div>
        </div>
    </div>

    <!-- 画面最下部の項目プレビュー（将来拡張用） -->
    <div class="table-header-preview">
        <span>年齢</span> <span>生活費</span> <span>年金</span> <span>運用資産</span> <span>現金</span> <span>総資産</span>
    </div>

<script>
    // 1. 要素の取得
    const sliders = {
        invest: document.getElementById('investAsset'),
        cash: document.getElementById('cashAsset'),
        yield: document.getElementById('yield'),
        inflation: document.getElementById('inflation')
    };

    const labels = {
        invest: document.getElementById('investAssetVal'),
        cash: document.getElementById('cashAssetVal'),
        yield: document.getElementById('yieldVal'),
        inflation: document.getElementById('inflationVal')
    };

    const outputs = {
        asset60: document.getElementById('asset60'),
        asset70: document.getElementById('asset70'),
        asset90: document.getElementById('asset90'),
        risk: document.getElementById('riskStatus')
    };

    const calcBtn = document.getElementById('calcBtn');

    // 金額フォーマット関数
    function formatOkuMan(yen) {
        if (yen <= 0) return "0円";
        const man = Math.round(yen / 10000);
        if (man >= 10000) {
            const oku = Math.floor(man / 10000);
            const remainingMan = man % 10000;
            return remainingMan > 0 ? `${oku}億${remainingMan.toLocaleString()}万円` : `${oku}億円`;
        }
        return `${man.toLocaleString()}万円`;
    }

    // スライドバーの横にある「テキスト数値のみ」をリアルタイム更新する関数
    function updateLabelsOnly() {
        labels.invest.textContent = parseFloat(sliders.invest.value).toLocaleString();
        labels.cash.textContent = parseFloat(sliders.cash.value).toLocaleString();
        labels.yield.textContent = parseFloat(sliders.yield.value).toFixed(1);
        labels.inflation.textContent = parseFloat(sliders.inflation.value).toFixed(1);
    }

    // ボタンを押した時に「計算を実行して下の数字を書き換える」関数
    function runSimulation() {
        const investVal = parseFloat(sliders.invest.value); 
        const cashVal = parseFloat(sliders.cash.value);     
        const yieldVal = parseFloat(sliders.yield.value);   
        const inflationVal = parseFloat(sliders.inflation.value); 

        // 簡易計算ロジック (60歳=10年後, 70歳=20年後, 90歳=40年後を想定)
        const realRate = (yieldVal - inflationVal) / 100;
        const startTotal = (investVal + cashVal) * 10000; 

        const total60 = startTotal * Math.pow(1 + realRate, 10);
        const total70 = startTotal * Math.pow(1 + realRate, 20);
        const total90 = startTotal * Math.pow(1 + realRate, 40);

        // 結果画面の書き換え
        outputs.asset60.textContent = formatOkuMan(total60);
        outputs.asset70.textContent = formatOkuMan(total70);
        outputs.asset90.textContent = formatOkuMan(total90);

        // 枯渇リスク判定
        if (total90 <= 0) {
            outputs.risk.textContent = "⚠️ 高リスク（90歳までに枯渇の可能性）";
            outputs.risk.style.color = "#dc2626";
        } else if (total90 < startTotal * 0.5) {
            outputs.risk.textContent = "⚡ 中リスク（資産が減少傾向）";
            outputs.risk.style.color = "#d97706";
        } else {
            outputs.risk.textContent = "✅ 低リスク（資産維持・安定）";
            outputs.risk.style.color = "#16a34a";
        }
    }

    // スライドバーを動かした時は、横の「◯◯万」「◯%」の数値テキストだけを動かす
    Object.values(sliders).forEach(slider => {
        if (slider) slider.addEventListener('input', updateLabelsOnly);
    });

    // 実行ボタンをクリックした時に初めてシミュレーションを走らせる
    calcBtn.addEventListener('click', runSimulation);

    // 最初の読み込み時：バーの数値の同期＋初期の計算結果を一度表示させておく
    window.addEventListener('DOMContentLoaded', () => {
        updateLabelsOnly();
        runSimulation();
    });
</script>

</body>
</html>
